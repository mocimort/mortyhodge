[project]
name = "knowledge-engine"
version = "0.1.0"
description = "Hodge Knowledge Engine — ServiceTitan tickets to a universal AI knowledge base"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[project.scripts]
ke = "knowledge_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
